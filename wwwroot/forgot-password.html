<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f8f7">
  <title>Forgot your password? — RoadWatch</title>
  <link rel="stylesheet" href="/css/auth.css?v=20261108b">
  <script src="/js/auth.js" defer></script>
</head>
<body data-mode="reset">
  <header class="auth-topbar"><a class="auth-brand" href="/login.html" aria-label="RoadWatch sign in"><span class="brand-mark"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="m6 25 7-18h6l7 18M9 18h14M16 9v3m0 6v4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>road<strong>watch</strong><small>FLEET & ROAD INTELLIGENCE</small></span></a><span class="topbar-caption">TRUCK & ROAD MONITORING</span></header>
  <main class="auth-layout">
    <section class="auth-card" aria-labelledby="auth-title">
      <div class="card-heading">
        <span class="auth-emblem" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3 4 6v6c0 4 4.5 7.2 8 9 3.5-1.8 8-5 8-9V6l-8-3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m8.5 12 2.5 2.5 4.5-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <h1 id="auth-title">Forgot your password?</h1>
        <p class="auth-description">We’ll send a link to help you reset your password.</p>
      </div>
      <form id="auth-form"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required maxlength="254"><p id="auth-status" class="auth-status" role="status" hidden></p><p id="auth-error" class="auth-error" role="alert" hidden></p><button id="submit-auth" class="auth-submit" type="submit" disabled>Send reset link <span>→</span></button></form><p class="switch-auth">Remember your password? <a href="/login.html">Back to sign in</a></p>
    </section>
    <p class="demo-caption"><span></span> Truck and road monitoring</p>
  </main>
  <footer class="auth-footer"><span>© 2026 RoadWatch</span><span>Fleet visibility. Road awareness.</span></footer>
</body>
</html>
